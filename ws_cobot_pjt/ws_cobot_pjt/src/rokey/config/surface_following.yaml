# defect_scan hybrid (surface_follow) only. SI units; latency/stiffness/braking are assumptions to identify.
force: 1.5
pointcloud_format: plt     # plt | ply; --pointcloud-format overrides this value
speed: 0.005
hz: 40.0
kp: 0.1
ki: 0.15
latency_budget: 0.10
stiffness_bound: 3500.0
braking: 0.08
soft_margin: 1.6         # overload above force + margin (filtered); Gazebo contact transients reach ~2.7 N at 1.5 N
spacing: 0.0005
clearance: 0.010
angular_speed: 0.26        # tool re-aiming in contact, rad/s (15 deg/s; a 40 mm dome at 2 mm/s needs ~3 deg/s)
angular_acceleration: 0.52
search_speed: 0.0015       # m/s toward the surface before contact (3 mm/s hit the stiff Gazebo contact at ~5.5 N)
moment_residual: 0.04     # N.m, off-sphere contact check (filtered, 0.2 s); Gazebo shows up to 16 mN.m in free space, 32 in unload
