# Vehicle types (rokey/meshes/vehicles, CC0 RgsDev low-poly pack), scaled down for the robot workspace: one
# scale for all types, the longest (sports) 400 mm overall -> sedan 365 x 197 x 140, suv 352 x 197 x 161,
# sports 400 x 184 x 129 mm (L x W x H, W with mirrors). The DAE is Y-up with x to the left and z to the front.
# parts: region boxes [x_min, y_min, z_min, x_max, y_max, z_max] in the vehicle frame (mm, x front, y left,
# z up, origin at the footprint centre on the ground); a body triangle goes to the first box holding its
# centroid, the rest stays `body`. Part codes follow INTERFACE.md (mirror_l on +y).
types:
  sedan:
    color: [0.62, 0.64, 0.68]              # simulation display (rgb)
    mesh: meshes/vehicles/rgsdev/sedan.dae
    mm_per_unit: 0.69835
    parts:
      mirror_l: [62.9, 77.5, 75.4, 86.6, 104.8, 103.4]
      mirror_r: [62.9, -104.8, 75.4, 86.6, -77.5, 103.4]
      bonnet: [75.4, -74.0, 79.6, 188.6, 74.0, 93.6]
  suv:
    color: [0.33, 0.24, 0.45]              # simulation display (rgb)
    mesh: meshes/vehicles/rgsdev/suv.dae
    mm_per_unit: 0.69835
    parts:
      mirror_l: [60.1, 77.5, 89.4, 85.2, 104.8, 117.3]
      mirror_r: [60.1, -104.8, 89.4, 85.2, -77.5, 117.3]
      bonnet: [69.8, -74.0, 81.0, 174.6, 74.0, 103.4]
  sports:
    color: [0.78, 0.1, 0.08]              # simulation display (rgb)
    mesh: meshes/vehicles/rgsdev/sports.dae
    mm_per_unit: 0.69835
    parts:
      mirror_l: [34.9, 80.4, 83.8, 58.7, 97.8, 104.8]
      mirror_r: [34.9, -97.8, 83.8, 58.7, -80.4, 104.8]
      bonnet: [47.5, -64.2, 53.1, 203.9, 64.2, 89.4]

# Gazebo performance coupon (source dimensions kept in millimetres).
performance:
  mesh: meshes/fracture_sample.stl   # mm; source +Y becomes coupon +Z
  pose_mm_deg: [400.0, 0.0, 0.0]
  lift_mm: 50.0
  color: [0.65, 0.48, 0.28]
  friction: 0.01


# --car real (native session): the team's vehicle assembly (rokey-b3-project1, meshes/vehicles/b3_project1), not
# one of `types` (choose_car, --car random). Placed on the robot's front axis (BASE +x, y = 0), its front toward the
# robot, the front bumper at nose_x_mm (the contact block and hemisphere are left out of this scene).
# The STL is tilted and in unknown units: front / left are raw STL directions from the wheel centres (rear -> front
# axle, right -> left wheel bodies: all four centres level), scaled to length_mm overall.
real:
  mesh: meshes/vehicles/b3_project1/assembly.stl
  front: [0.9822, 0.0268, -0.1857]
  left: [0.0355, 0.9454, 0.3239]
  length_mm: 250.0                  # ~1:18 like the team's vehicles -> 250 x 133 x 154 mm
  nose_x_mm: 410.0                  # 440 left each door's upper rear corner (x ~590) out of reach to back off from;
                                    # 410: doors 97-99 % covered, bonnet 100 %, HOME tool 42 mm clear of the vehicle
  lift_mm: 50.0                     # fixed this far above the table (jig not modelled)
  color: [0.36, 0.42, 0.30]         # simulation display (rgb)
  # Scan parts (rokey real_scan) from the assembly's bodies (connected shells): the bodies under the `parts` seed
  # points (vehicle frame mm, nearest triangle) are bonnet / bumper (front and rear); the other bodies reaching within
  # shell_mm[0] of the outer box (sides, ends, top) with their top above shell_mm[1] are the body (not wheels, axles,
  # seats, dashboard); body triangles at door x0..x1, z0..z1 facing sideways (|normal y| >= door[4]) are both doors.
  parts:
    bonnet: [[80.0, 0.0, 100.0]]
    bumper: [[124.5, 0.0, 53.0], [-124.0, 0.0, 57.0]]
  shell_mm: [15.0, 60.0]
  door: [-44.0, 40.0, 45.0, 135.0, 0.7]
